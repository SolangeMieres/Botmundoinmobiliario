<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consultas · Mundo Inmobiliario</title>
<meta name="description" content="Contanos qué necesitás y tu consulta le llega a nuestro equipo por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bordo:#4A161A; --rojo:#9E282C; --oro:#D9A93A; --papel:#FBF7EE;
    --tinta:#2A1D1D; --gris:#6B5E55; --linea:#E6DCCB; --burbuja:#FFFFFF;
    --wa:#1F8F4E;
  }
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  *,*::before,*::after{ box-sizing:inherit; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bordo); color:var(--tinta);
    font-family:'Manrope','Helvetica Neue',Arial,sans-serif; font-size:16px; line-height:1.45;
    display:flex; justify-content:center;
  }
  .app{
    width:100%; max-width:480px; height:100%;
    display:flex; flex-direction:column; background:var(--papel);
  }
  header{
    background:var(--bordo); color:var(--papel);
    padding:18px 20px 16px; display:flex; align-items:center; gap:14px;
  }
  .sello{ width:64px; flex:none; display:grid; place-items:center; }
  .sello img{ width:64px; height:auto; display:block; filter:drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
  .marca{ display:flex; flex-direction:column; min-width:0; }
  .marca b{ font-family:'DM Serif Display',Georgia,serif; font-weight:400; font-size:23px; line-height:1.05; }
  .marca span{ font-size:13.5px; color:#E9D8C4; }

  .chat{
    flex:1; overflow-y:auto; padding:20px 16px 12px;
    display:flex; flex-direction:column; gap:10px;
  }
  .msg{ max-width:86%; padding:11px 14px; border-radius:16px; font-size:15.5px; }
  .ella{ align-self:flex-start; background:var(--burbuja); border:1px solid var(--linea); border-bottom-left-radius:5px; }
  .vos{ align-self:flex-end; background:var(--rojo); color:#fff; border-bottom-right-radius:5px; }
  .nuevo{ animation:entra .28s ease-out; }
  @keyframes entra{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce){ .nuevo{ animation:none; } }

  .resumen{
    align-self:stretch; background:#fff; border:1px solid var(--linea); border-radius:16px;
    padding:16px; display:flex; flex-direction:column; gap:10px;
  }
  .resumen h2{ margin:0; font-family:'DM Serif Display',Georgia,serif; font-weight:400; font-size:22px; color:var(--rojo); }
  .resumen dl{ margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:15px; }
  .resumen dt{ color:var(--gris); }
  .resumen dd{ margin:0; font-weight:600; overflow-wrap:anywhere; }

  .panel{
    border-top:1px solid var(--linea); background:var(--papel);
    padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px;
  }
  .opciones{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    font:inherit; font-size:15px; font-weight:600; color:var(--bordo);
    background:#fff; border:1.5px solid var(--bordo); border-radius:999px;
    min-height:44px; padding:9px 16px; cursor:pointer;
  }
  .chip:hover{ background:#F3E7DA; }
  .chip:focus-visible,.boton:focus-visible,.enlace:focus-visible,input:focus-visible,textarea:focus-visible{
    outline:3px solid var(--oro); outline-offset:2px;
  }
  .campo{ display:flex; gap:8px; align-items:flex-end; }
  .campo input,.campo textarea{
    flex:1; font:inherit; font-size:16px; color:var(--tinta);
    background:#fff; border:1.5px solid var(--linea); border-radius:14px;
    padding:11px 14px; min-height:46px; resize:none; min-width:0;
  }
  .boton{
    font:inherit; font-weight:700; font-size:15.5px; border:0; border-radius:14px;
    min-height:46px; padding:11px 18px; cursor:pointer;
    background:var(--bordo); color:#fff;
  }
  .boton:disabled{ opacity:.45; cursor:not-allowed; }
  .wa{ background:var(--wa); width:100%; display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none; font-size:17px; min-height:54px; }
  .wa svg{ width:22px; height:22px; }
  .pie{ display:flex; justify-content:space-between; gap:12px; }
  .enlace{
    font:inherit; font-size:14px; font-weight:600; color:var(--gris);
    background:none; border:0; padding:6px 2px; cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }
  .aviso{ font-size:13px; color:var(--gris); text-align:center; margin:0; }
</style>
</head>

<script>
/* =========================================================
   CONFIGURACIÓN
   EQUIPO: cada consulta se asigna al azar, según el "peso" de cada persona.
   Peso 2 = recibe el doble que alguien con peso 1.
   WhatsApp: 549 + código de área sin 0 + número sin 15.
   Ejemplo para 11 1234-5678 → "5491112345678".
   Si un número queda vacío (""), esa persona no recibe consultas.
   ========================================================= */
const EQUIPO = [
  { nombre: "Andrea", whatsapp: "5491124851178", peso: 1 },
  { nombre: "Noelia", whatsapp: "5491158090593", peso: 1 },
  { nombre: "Lucas",  whatsapp: "5491148701752", peso: 1 }
];
const DISPONIBLES = EQUIPO.filter(p => /^\d{12,13}$/.test(p.whatsapp));
const TOTAL_PESO = DISPONIBLES.reduce((s, p) => s + (p.peso || 1), 0);
/* Turno: se pide al contador del servidor (una consulta para cada uno, en orden).
   Si el contador no responde, se sortea al azar como respaldo. */
function sorteo(){
  let r = Math.random() * TOTAL_PESO;
  for (const p of DISPONIBLES) { r -= (p.peso || 1); if (r < 0) return p; }
  return DISPONIBLES[DISPONIBLES.length - 1];
}
let ASIGNADO = sorteo();
async function pedirTurno(){
  try{
    const r = await fetch("/api/turno", { cache: "no-store" });
    if(!r.ok) return;
    const { n } = await r.json();
    if(Number.isInteger(n) && n > 0) ASIGNADO = DISPONIBLES[(n - 1) % DISPONIBLES.length];
  }catch(e){ /* sin servidor: queda el sorteo */ }
}

const ZONAS = ["San Martín","Villa Devoto","Villa del Parque","Villa Pueyrredón","Otro barrio de CABA","Otro partido de Provincia"];
const TIPOS = ["Departamento","Casa","PH","Local","Oficina","Lote u otro"];

const FLUJOS = {
  tasar: {
    etiqueta: "Tasar mi propiedad", titulo: "Tasación",
    pasos: [
      { clave:"tipo", pregunta:"¿Qué tipo de propiedad querés tasar?", opciones:TIPOS },
      { clave:"zona", pregunta:"¿En qué barrio está?", opciones:ZONAS },
      { clave:"motivo", pregunta:"¿Para qué necesitás la tasación?", opciones:["Quiero venderla","Quiero alquilarla","Solo saber cuánto vale"] }
    ]
  },
  alquilar: {
    etiqueta: "Busco alquilar", titulo: "Alquiler",
    pasos: [
      { clave:"uso", pregunta:"¿Qué estás buscando alquilar?", opciones:["Vivienda","Local comercial","Oficina"] },
      { clave:"ambientes", pregunta:"¿Cuántos ambientes necesitás?", opciones:["1 ambiente","2 ambientes","3 ambientes","4 o más"], si:r=>r.uso==="Vivienda" },
      { clave:"rubro", pregunta:"¿Para qué rubro es?", opciones:["Gastronomía","Comercio","Servicios profesionales","Otro rubro"], si:r=>r.uso!=="Vivienda" },
      { clave:"zona", pregunta:"¿En qué zona?", opciones:ZONAS },
      { clave:"garantia", pregunta:"¿Con qué garantía contás?", opciones:["Garantía propietaria","Seguro de caución","Recibo de sueldo","Todavía no sé"] }
    ]
  },
  comprar: {
    etiqueta: "Busco comprar", titulo: "Compra",
    pasos: [
      { clave:"tipo", pregunta:"¿Qué tipo de propiedad buscás?", opciones:TIPOS },
      { clave:"ambientes", pregunta:"¿Cuántos ambientes?", opciones:["1 ambiente","2 ambientes","3 ambientes","4 o más"], si:r=>["Departamento","Casa","PH"].includes(r.tipo) },
      { clave:"zona", pregunta:"¿En qué zona?", opciones:ZONAS }
    ]
  },
  publicada: {
    etiqueta: "Consultar una propiedad publicada", titulo: "Propiedad publicada",
    pasos: [
      { clave:"propiedad", pregunta:"¿Por cuál propiedad me escribís? Pegá el link o escribí la dirección.", texto:"Link o dirección" }
    ]
  },
  anuncio: {
    etiqueta: "Me interesa esta propiedad", titulo: "Propiedad del anuncio",
    pasos: [
      { clave:"propiedad", pregunta:"Esta es la propiedad que viste:", texto:"Link o dirección" },
      { clave:"pago", pregunta:"¿Cuál sería la opción de compra prevista?", opciones:["Crédito","Contado","Tengo que vender para comprar","Aún no lo definí"] },
      { clave:"mudanza", pregunta:"¿Cuál es tu tiempo estimado de mudanza?", opciones:["Inmediato","Dentro de 1 a 3 meses","Dentro de 3 a 6 meses","Sin fecha definida"] }
    ]
  },
  otra: {
    etiqueta: "Otra consulta", titulo: "Otra consulta",
    pasos: [
      { clave:"mensaje", pregunta:"Contame en qué te puedo ayudar.", texto:"Tu consulta", largo:true }
    ]
  }
};

const ROTULOS = { tipo:"Propiedad", zona:"Zona", motivo:"Motivo", uso:"Busca", ambientes:"Ambientes", rubro:"Rubro", garantia:"Garantía", propiedad:"Propiedad", pago:"Opción de compra", mudanza:"Mudanza estimada", mensaje:"Consulta", nombre:"Nombre" };

const ORIGENES = { instagram:"Instagram", facebook:"Facebook", google:"Google", web:"la web", cartel:"el cartel", anuncio:"un anuncio de Instagram" };
const origen = ORIGENES[(new URLSearchParams(location.search).get("desde")||"").toLowerCase()] || "las redes";

/* Propiedades con anuncio: el link ?prop=clave abre la consulta directo en esa propiedad.
   Para pautar otra, sumá una línea acá y usá su clave en el link.
   "responsable": nombre de quien atiende esa propiedad (tiene que estar en EQUIPO).
   Si no lo ponés, la consulta va por turno entre todos. */
const PROPIEDADES = {
  "ph-floresta":  { texto:"PH en Floresta, 3 ambientes, U$S 109.000 (MD15719)" },
  "virasoro-8b":  { texto:"Virasoro al 900, Caballito · 3 ambientes (8° B)", responsable:"Andrea" },
  "virasoro-9a":  { texto:"Virasoro al 900, Caballito · 4 ambientes con terraza (9° A)", responsable:"Andrea" },
  "virasoro-10a": { texto:"Virasoro al 900, Caballito · 3 ambientes (10° A)", responsable:"Andrea" },
  "san-jose":     { texto:"Monoambiente en San José al 300", responsable:"Andrea" }
};
const PROP_DATOS = PROPIEDADES[(new URLSearchParams(location.search).get("prop")||"").toLowerCase()];
const PROP = PROP_DATOS ? PROP_DATOS.texto : null;
const RESPONSABLE = PROP_DATOS && PROP_DATOS.responsable ? DISPONIBLES.find(p=>p.nombre===PROP_DATOS.responsable) : null;
if(RESPONSABLE) ASIGNADO = RESPONSABLE; else pedirTurno();
function nuevaAsignacion(){ if(RESPONSABLE){ ASIGNADO = RESPONSABLE; } else { ASIGNADO = sorteo(); pedirTurno(); } }

/* Estado: flujo elegido + respuestas en orden */
const FLUJO_PROP = PROP ? (RESPONSABLE ? "anuncio" : "publicada") : null;
let flujo = FLUJO_PROP;
let historial = PROP ? [{ clave:"propiedad", valor:PROP }] : []; // [{clave, valor}]

const chat = document.getElementById("chat");
const panel = document.getElementById("panel");

function respuestas(){ const r={}; historial.forEach(h=>r[h.clave]=h.valor); return r; }
function pasosActivos(){
  if(!flujo) return [];
  const r = respuestas();
  return FLUJOS[flujo].pasos.filter(p=>!p.si || p.si(r));
}
function siguientePaso(){
  const hechos = new Set(historial.map(h=>h.clave));
  const p = pasosActivos().find(p=>!hechos.has(p.clave));
  if(p) return p;
  if(!hechos.has("nombre")) return flujo==="anuncio"
    ? { clave:"nombre", pregunta:"Por último, ¿cómo te llamás?", texto:"Tu nombre" }
    : { clave:"nombre", pregunta:"Por último, ¿cómo te llamás?", texto:"Tu nombre", saltear:"Prefiero no decirlo" };
  return null;
}

function burbuja(texto, quien, nuevo){
  const d = document.createElement("div");
  d.className = "msg " + quien + (nuevo ? " nuevo" : "");
  d.textContent = texto;
  chat.appendChild(d);
}

function render(){
  chat.innerHTML = ""; panel.innerHTML = "";
  if(flujo==="anuncio"){
    burbuja("¡Hola! Gracias por tu interés. Te hago dos preguntas rápidas y te paso con "+ASIGNADO.nombre+", que te va a responder por WhatsApp.", "ella", historial.length<=1);
  } else {
    burbuja("¡Hola! Somos Mundo Inmobiliario. Te hago un par de preguntas así tu consulta nos llega completa por WhatsApp.", "ella", !flujo);
    burbuja("¿Qué necesitás?", "ella", !flujo);
  }

  if(flujo){
    if(flujo!=="anuncio") burbuja(FLUJOS[flujo].etiqueta, "vos");
    const pasos = [...pasosActivos(), { clave:"nombre", pregunta:"Por último, ¿cómo te llamás?" }];
    historial.forEach(h=>{
      const p = pasos.find(x=>x.clave===h.clave);
      if(p) burbuja(p.pregunta, "ella");
      burbuja(h.valor || "Prefiero no decirlo", "vos");
    });
  }

  if(!flujo){
    opciones(Object.entries(FLUJOS).filter(([k])=>k!=="anuncio").map(([k,f])=>({ texto:f.etiqueta, accion:()=>{ flujo=k; historial=[]; render(); } })));
  } else {
    const p = siguientePaso();
    if(p){
      burbuja(p.pregunta, "ella", true);
      if(p.opciones) opciones(p.opciones.map(o=>({ texto:o, accion:()=>responder(p.clave,o) })));
      else campo(p);
    } else {
      mostrarResumen();
    }
    pie();
  }
  requestAnimationFrame(()=>{ chat.scrollTop = chat.scrollHeight; });
}

function responder(clave, valor){ historial.push({ clave, valor }); render(); }

function opciones(lista){
  const g = document.createElement("div");
  g.className = "opciones"; g.setAttribute("role","group"); g.setAttribute("aria-label","Elegí una opción");
  lista.forEach(o=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = o.texto; b.onclick = o.accion;
    g.appendChild(b);
  });
  panel.appendChild(g);
}

function campo(p){
  const f = document.createElement("div"); f.className = "campo";
  const i = document.createElement(p.largo ? "textarea" : "input");
  if(!p.largo) i.type = "text";
  if(p.largo) i.rows = 3;
  i.placeholder = p.texto; i.setAttribute("aria-label", p.texto); i.maxLength = 300;
  const b = document.createElement("button");
  b.type = "button"; b.className = "boton"; b.textContent = "Responder"; b.disabled = true;
  i.addEventListener("input", ()=>{ b.disabled = i.value.trim().length < 2; });
  i.addEventListener("keydown", e=>{ if(e.key==="Enter" && !p.largo && !b.disabled){ e.preventDefault(); b.click(); } });
  b.onclick = ()=>responder(p.clave, i.value.trim());
  f.append(i, b); panel.appendChild(f);
  if(p.saltear){
    const s = document.createElement("button");
    s.type="button"; s.className="enlace"; s.textContent=p.saltear; s.style.alignSelf="flex-start";
    s.onclick = ()=>responder(p.clave, "");
    panel.appendChild(s);
  }
  setTimeout(()=>i.focus({ preventScroll:true }), 50);
}

function mensajeWhatsApp(){
  const lineas = flujo==="anuncio"
    ? [`Hola ${ASIGNADO.nombre}, te escribo por ${origen}.`]
    : [`Hola ${ASIGNADO.nombre}, te escribo desde ${origen}.`, `Consulta: ${FLUJOS[flujo].titulo}`];
  historial.forEach(h=>{ if(h.clave!=="nombre" && h.valor) lineas.push(`${ROTULOS[h.clave]}: ${h.valor}`); });
  const nombre = (historial.find(h=>h.clave==="nombre")||{}).valor;
  if(nombre) lineas.push(`Mi nombre es ${nombre}.`);
  return lineas.join("\n");
}

function mostrarResumen(){
  burbuja(`¡Listo! Revisá tu consulta y enviala por WhatsApp. Te va a responder ${ASIGNADO.nombre}, de nuestro equipo.`, "ella", true);
  const c = document.createElement("section"); c.className = "resumen nuevo";
  const h = document.createElement("h2"); h.textContent = "Tu consulta";
  const dl = document.createElement("dl");
  const filas = [...(flujo==="anuncio" ? [] : [["Consulta", FLUJOS[flujo].titulo]]), ...historial.filter(x=>x.valor).map(x=>[ROTULOS[x.clave], x.valor])];
  filas.forEach(([k,v])=>{ const dt=document.createElement("dt"); dt.textContent=k; const dd=document.createElement("dd"); dd.textContent=v; dl.append(dt,dd); });
  c.append(h, dl); chat.appendChild(c);

  const a = document.createElement("a");
  /* Dentro de Instagram/Facebook, abrir en otra pestaña a veces no funciona: ahí se abre en la misma. */
  const enApp = /Instagram|FBAN|FBAV|FB_IAB|FBIOS/i.test(navigator.userAgent);
  a.className = "boton wa";
  if(!enApp){ a.target = "_blank"; a.rel = "noopener"; }
  a.href = `https://api.whatsapp.com/send?phone=${ASIGNADO.whatsapp}&text=${encodeURIComponent(mensajeWhatsApp())}`;
  a.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.2A9.8 9.8 0 0 0 3.6 17l-1.4 4.8 4.9-1.3A9.8 9.8 0 1 0 12 2.2Zm0 17.8c-1.5 0-2.9-.4-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1 1 12 20Zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8.9c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.2.1-.1 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1c0 1.2.9 2.4 1 2.6.1.2 1.8 2.7 4.3 3.8 1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.5-.3Z"/></svg><span>Enviar por WhatsApp</span>';
  panel.appendChild(a);
  const p = document.createElement("p"); p.className = "aviso";
  p.textContent = "Se abre WhatsApp con el mensaje listo. Solo tenés que tocar enviar.";
  panel.appendChild(p);
  const tel = ASIGNADO.whatsapp.replace(/^549(\d{2})(\d{4})(\d{4})$/, "$1 $2-$3");
  const r = document.createElement("p"); r.className = "aviso";
  r.textContent = `¿No se abrió WhatsApp? Escribile a ${ASIGNADO.nombre} al ${tel}.`;
  panel.appendChild(r);
}

function pie(){
  const f = document.createElement("div"); f.className = "pie";
  const atras = document.createElement("button");
  atras.type="button"; atras.className="enlace"; atras.textContent="Cambiar la respuesta anterior";
  atras.onclick = ()=>{
    const fija = PROP && flujo===FLUJO_PROP ? 1 : 0;
    if(historial.length>fija){ historial.pop(); } else if(!FLUJO_PROP){ flujo=null; }
    render();
  };
  const reinicio = document.createElement("button");
  reinicio.type="button"; reinicio.className="enlace"; reinicio.textContent="Empezar de nuevo";
  reinicio.onclick = ()=>{
    flujo = FLUJO_PROP; historial = PROP ? [{ clave:"propiedad", valor:PROP }] : [];
    nuevaAsignacion(); render();
  };
  f.append(atras, reinicio); panel.appendChild(f);
}

render();
</script>
