<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contador de consultas · Mundo Inmobiliario</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bordo:#4A161A; --bordo2:#6E1F26; --oro:#E2B44F; --oro2:#F6DC97; --crema:#FBF4E6; --tenue:#E7CFC0; }
  *{ box-sizing:border-box; }
  html{ background:#2B0B0F; }
  html,body{ margin:0; min-height:100vh; }
  body{
    font-family:'Manrope','Helvetica Neue',Arial,sans-serif; color:var(--crema);
    background:radial-gradient(120% 70% at 50% 0%, #7A2530 0%, var(--bordo) 55%, #2B0B0F 100%) no-repeat;
    padding:max(20px,env(safe-area-inset-top)) 16px 32px;
  }
  .app{ max-width:560px; margin:0 auto; }
  header{ text-align:center; margin-bottom:22px; }
  header small{ display:block; letter-spacing:.18em; text-transform:uppercase; font-size:12px; font-weight:700; color:var(--oro); }
  h1{ font-family:'DM Serif Display',Georgia,serif; font-weight:400; font-size:34px; line-height:1.05; margin:6px 0 4px;
      background:linear-gradient(180deg,var(--oro2),var(--oro) 55%,#B9852C); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p{ margin:0; color:var(--tenue); font-size:14px; }
  .tarjeta{
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
    border:1.5px solid rgba(226,180,79,.55); border-radius:22px; padding:20px 18px; margin-bottom:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .tarjeta h2{ margin:0 0 4px; font-family:'DM Serif Display',Georgia,serif; font-weight:400; font-size:23px; color:var(--oro2); }
  .sub{ margin:0 0 16px; font-size:13.5px; color:var(--tenue); }
  .paso{ margin-bottom:13px; }
  .fila{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:14.5px; }
  .fila b{ font-size:22px; font-weight:800; color:#fff; font-variant-numeric:tabular-nums; }
  .barra{ height:10px; border-radius:99px; background:rgba(255,255,255,.1); margin-top:6px; overflow:hidden; }
  .barra i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#B9852C,var(--oro),var(--oro2)); transition:width .6s ease; }
  .final .fila b{ color:var(--oro2); }
  .final .barra i{ background:linear-gradient(90deg,#1F8F4E,#3CC07A); }
  .resumen{ margin-top:14px; padding-top:14px; border-top:1px solid rgba(226,180,79,.3); font-size:14.5px; color:var(--crema); }
  .resumen strong{ color:var(--oro2); }
  .pie{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px; color:var(--tenue); margin-top:6px; }
  button{
    font:inherit; font-weight:700; font-size:14px; color:var(--bordo); cursor:pointer;
    background:linear-gradient(180deg,var(--oro2),var(--oro)); border:0; border-radius:99px; padding:10px 18px; min-height:44px;
  }
  button:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
  .aviso{ text-align:center; color:var(--tenue); font-size:15px; padding:30px 10px; }
  @media (prefers-reduced-motion:reduce){ .barra i{ transition:none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <small>Mundo Inmobiliario</small>
    <h1>Consultas desde los anuncios</h1>
    <p>Cuántas personas pasan por cada paso del bot</p>
  </header>
  <main id="lista"><p class="aviso">Cargando…</p></main>
  <div class="pie"><span id="hora"></span><button type="button" id="actualizar">Actualizar</button></div>
</div>
<script>
const NOMBRES = {
  "virasoro-8b":"Virasoro 8° B · 3 ambientes",
  "virasoro-9a":"Virasoro 9° A · 4 ambientes",
  "virasoro-10a":"Virasoro 10° A · 3 ambientes",
  "san-jose":"Monoambiente San José",
  "ph-floresta":"PH en Floresta"
};
const PASOS = ["Entraron al bot","Respondieron la opción de compra","Respondieron el tiempo de mudanza","Dejaron su nombre","Tocaron “Enviar por WhatsApp”"];
const lista = document.getElementById("lista");

function tarjeta(clave, valores){
  const nums = Object.values(valores);
  const base = Math.max(nums[0] || 0, 1);
  const t = document.createElement("section"); t.className = "tarjeta";
  const h = document.createElement("h2"); h.textContent = NOMBRES[clave] || clave;
  const s = document.createElement("p"); s.className = "sub"; s.textContent = "Total desde que se activó el contador";
  t.append(h, s);
  PASOS.forEach((nombre,i)=>{
    const n = nums[i] || 0;
    const d = document.createElement("div"); d.className = "paso" + (i===PASOS.length-1 ? " final" : "");
    const f = document.createElement("div"); f.className = "fila";
    const sp = document.createElement("span"); sp.textContent = nombre;
    const b = document.createElement("b"); b.textContent = n.toLocaleString("es-AR");
    f.append(sp, b);
    const br = document.createElement("div"); br.className = "barra";
    const i2 = document.createElement("i"); i2.style.width = Math.round(n / base * 100) + "%";
    br.appendChild(i2); d.append(f, br); t.appendChild(d);
  });
  const r = document.createElement("p"); r.className = "resumen";
  const ent = nums[0] || 0, wa = nums[4] || 0;
  r.innerHTML = !ent ? "Todavía no entró nadie desde el anuncio."
    : ent < 30 ? "Todavía hay pocos datos para sacar conclusiones. Con 30 personas o más, acá vas a ver el porcentaje."
    : `De cada 100 personas que entran, <strong>${Math.round(wa/ent*100)}</strong> tocan “Enviar por WhatsApp”.`;
  t.appendChild(r);
  return t;
}

async function cargar(){
  try{
    const r = await fetch("/api/evento?prop=todas", { cache:"no-store" });
    const datos = await r.json();
    if(!r.ok) throw new Error(datos.error || "error");
    lista.innerHTML = "";
    const claves = Object.keys(datos).filter(k => k==="virasoro-8b" || Object.values(datos[k]).some(v=>v>0));
    claves.forEach(k => lista.appendChild(tarjeta(k, datos[k])));
    document.getElementById("hora").textContent = "Actualizado a las " + new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    lista.innerHTML = '<p class="aviso">No se pudo cargar el contador. Probá de nuevo en un rato.</p>';
  }
}
document.getElementById("actualizar").onclick = cargar;
cargar();
</script>
</body>
</html>
